<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Тренировки</title>
<meta name="description" content="Дневник тренировок: журнал подходов, каталог упражнений, уровни силы и прогноз">
<meta name="theme-color" content="#0A0B10">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Тренировки">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
  /* тема до первой отрисовки, чтобы не мигало */
  try{ var t = localStorage.getItem("wd.theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); }catch(e){}
</script>
<script type="module" src="/src/main.js"></script>
</head>
<body>
<div id="sync" role="status"></div>
<div class="app">
  <main id="main" tabindex="-1">
    <!-- скелетон до загрузки скрипта -->
    <div aria-busy="true" aria-label="Загрузка" style="padding-top:8px">
      <div style="display:flex;gap:10px;height:56px;align-items:center"><div class="sk" style="width:44px;height:44px;border-radius:50%"></div><div class="sk" style="width:44px;height:44px;border-radius:14px"></div></div>
      <div class="sk hero"></div>
      <div class="sk line" style="width:40%;margin-top:28px"></div>
      <div class="kv" style="margin-top:12px"><div class="sk card"></div><div class="sk card"></div></div>
    </div>
  </main>
</div>
<div class="dock" id="dock"><div id="rest" hidden></div><div id="dock-action"></div></div>
<nav class="nav" id="nav" aria-label="Разделы">
  <button data-tab="today" aria-label="Главная" title="Главная"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg></i></button>
  <button data-tab="progress" aria-label="Прогресс" title="Прогресс"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18l5-6 4 4 7-9"/><path d="M15 7h5v5"/></svg></i></button>
  <button data-tab="history" aria-label="История" title="История"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></i></button>
  <button data-tab="catalog" aria-label="Каталог" title="Каталог"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg></i></button>
  <button data-tab="profile" aria-label="Профиль" title="Профиль"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></i></button>
</nav>
<div class="sheet-wrap" id="sheet" hidden></div>
<div id="live" class="sr" aria-live="polite"></div>
</body>
</html>
